name: MenuFold
options:
  bundleIdPrefix: com.menufold
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # UI strings are keyed by their Ukrainian text (App/Localizable.xcstrings); English is the
  # other localization. Info.plist's CFBundleDevelopmentRegion is "en", so any other system
  # language falls back to English.
  developmentLanguage: uk
packages:
  MenuFoldCore:
    path: Packages/MenuFoldCore
  # In-app updates. The feed (appcast.xml) is a GitHub release asset; see scripts/release.sh.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  MenuFold:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      # XcodeGen adds `.xcassets` bundles to Copy Bundle Resources and compiles them with
      # actool, so the icon needs no extra build phase.
      - path: App
    dependencies:
      - package: MenuFoldCore
        product: MenuFoldCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.menufold.MenuFold
        PRODUCT_NAME: MenuFold
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
        # Lets Xcode keep App/Localizable.xcstrings in sync with the strings in the code.
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.4.2"
        # Debug builds only: scripts/release.sh sets the build number to the commit count, which
        # Sparkle compares to decide whether an update is newer.
        CURRENT_PROJECT_VERSION: "6"
        COMBINE_HIDPI_IMAGES: YES
        # App icon from App/Assets.xcassets/AppIcon.appiconset (fills CFBundleIconFile/Name).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  MenuFold:
    build:
      targets:
        MenuFold: all
    run:
      config: Debug
    archive:
      config: Release
