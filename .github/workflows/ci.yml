name: CI

on:
  # PRs run their own `pull_request` pass; pushing other branches does not need a second run.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The app deploys to macOS 26; both the App/ typecheck and the app build need an SDK at least this new.
  MENUFOLD_MIN_SDK_MAJOR: "26"

jobs:
  core:
    name: MenuFoldCore (build + tests)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check localization
        # No dependencies, takes a second. Errors fail the job; stale keys and unlocalized
        # NSAlert/NSMenuItem literals are reported as annotations.
        run: python3 scripts/check-localization.py

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: Packages/MenuFoldCore/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Packages/MenuFoldCore/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build and test
        working-directory: Packages/MenuFoldCore
        run: |
          swift build
          swift test --parallel

  typecheck-app:
    # Fast App/ check when a full Xcode with a macOS >= 26 SDK is available. The shimmed fallback of
    # scripts/typecheck-app.sh is refused on CI on purpose: its stand-ins are not the real macros, so
    # it used to pass on a machine where the app itself did not compile. Without a usable SDK this job
    # fails with an error annotation (never a silent skip).
    name: App typecheck
    runs-on: macos-26
    timeout-minutes: 20
    needs: [core]
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain and SDK
        id: toolchain
        run: |
          set -euo pipefail
          echo "xcode-select: $(xcode-select -p)"
          swift --version | head -1
          sdk="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo 0)"
          echo "macOS SDK: $sdk"
          if [[ "${sdk%%.*}" -ge "${MENUFOLD_MIN_SDK_MAJOR}" ]]; then
            echo "can=true" >> "$GITHUB_OUTPUT"
          else
            echo "can=false" >> "$GITHUB_OUTPUT"
            echo "::error title=macOS SDK too old::SDK $sdk is older than macOS ${MENUFOLD_MIN_SDK_MAJOR}; the runner image needs Xcode 27+. App/ was NOT typechecked."
            exit 1
          fi

      - name: Cache SwiftPM build
        if: steps.toolchain.outputs.can == 'true'
        uses: actions/cache@v6
        with:
          path: Packages/MenuFoldCore/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Packages/MenuFoldCore/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Typecheck App/ against the real SDK
        if: steps.toolchain.outputs.can == 'true'
        env:
          MENUFOLD_TYPE_CHECK: real
        run: ./scripts/typecheck-app.sh

  build-app:
    name: Build MenuFold.app
    runs-on: macos-26
    timeout-minutes: 40
    needs: [core]
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain and SDK
        id: sdk
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo 0)"
          echo "macOS SDK in use: $sdk_version"
          echo "version=$sdk_version" >> "$GITHUB_OUTPUT"
          if [[ "${sdk_version%%.*}" -lt "${MENUFOLD_MIN_SDK_MAJOR}" ]]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=macOS SDK too old::SDK $sdk_version cannot target macOS ${MENUFOLD_MIN_SDK_MAJOR}; the runner image needs Xcode 27+. The app was NOT built."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-xcodegen-${{ hashFiles('project.yml') }}
          restore-keys: brew-${{ runner.os }}-xcodegen-

      - name: Cache SwiftPM packages (Sparkle)
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install xcodegen (if missing)
        if: steps.sdk.outputs.ok == 'true'
        run: |
          set -euo pipefail
          xcrun --find xcodebuild   # full Xcode selected (the image's xcode-select points at one)
          if command -v xcodegen >/dev/null; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
            brew install xcodegen
          fi

      - name: Build (Release, unsigned)
        if: steps.sdk.outputs.ok == 'true'
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project MenuFold.xcodeproj -scheme MenuFold -configuration Release \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: Upload the app bundle
        if: steps.sdk.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MenuFold-app
          path: build/Build/Products/Release/MenuFold.app
          if-no-files-found: error
          retention-days: 7
