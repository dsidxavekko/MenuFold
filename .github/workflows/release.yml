name: Release

# Publishes MenuFold to GitHub Releases: a DMG for people, a zip + appcast.xml for Sparkle updates.
# Needs the repository secret SPARKLE_PRIVATE_KEY (the EdDSA key exported with Sparkle's
# `generate_keys -x`); without it the build stops, so no release ships that installs cannot update to.
#   - push a tag  v0.1.0   → builds that tag and creates release "MenuFold 0.1.0"
#   - manual run           → Enter a version (e.g. 0.1.0) and, optionally, an existing tag to build
# The build itself lives in scripts/release.sh, so CI and a local `scripts/release.sh` produce the
# same archive (same name, same contents, same SHA256SUMS format).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (defaults to MARKETING_VERSION in project.yml)"
        required: false
        default: ""
      tag:
        description: "Existing tag to build (defaults to v<version> created at the selected branch)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      # Full history: the tag may need to be created at a commit, and `git describe`-style
      # metadata is part of the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Work out the version and tag
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"[:space:]]*\)"\{0,1\}$/\1/p' project.yml | head -1)"
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
            tag="$REF_NAME"
          else
            version="${INPUT_VERSION:-$project_version}"
            tag="${INPUT_TAG:-v$version}"
          fi
          # The tag name is user-controlled text: refuse anything that is not a plain version
          # before it reaches an output, a shell or a release title.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Bad version::'$version' is not a version like 0.1.0"
            exit 1
          fi
          if [[ ! "$tag" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "::error title=Bad tag::'$tag' contains characters a tag name should not have"
            exit 1
          fi
          if [[ "$version" != "$project_version" ]]; then
            echo "::warning title=Version mismatch::Requested $version but project.yml has MARKETING_VERSION $project_version; the build overrides it to $version. Update project.yml to keep them in sync."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building version '$version' as tag '$tag' on $(git rev-parse --short=12 HEAD)"

      - name: Check the SDK supports macOS 26
        id: sdk
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK in use: $sdk_version"
          echo "version=$sdk_version" >> "$GITHUB_OUTPUT"
          if [[ "${sdk_version%%.*}" -lt 26 ]]; then
            echo "::error title=SDK too old::macOS SDK $sdk_version cannot target macOS 26. Release aborted — the tag exists, so fix the runner (needs Xcode 27+ / macos-26 image) and re-run the workflow."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Run the MenuFoldCore tests
        if: steps.sdk.outputs.ok == 'true'
        working-directory: Packages/MenuFoldCore
        run: swift test --parallel

      - name: Check localization
        run: python3 scripts/check-localization.py

      - name: Build number must exceed the published one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new="$(git rev-list --count HEAD)"
          if ! curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml" -o /tmp/published-appcast.xml; then
            echo "::notice::No published appcast yet; skipping the build number comparison."
            exit 0
          fi
          old="$(python3 - <<'PY'
          import re
          t = open('/tmp/published-appcast.xml', encoding='utf-8').read()
          m = re.search(r'<sparkle:version>\s*(\d+)\s*</sparkle:version>', t) or re.search(r'sparkle:version="(\d+)"', t)
          print(m.group(1) if m else 0)
          PY
          )"
          echo "build number: new=$new published=$old"
          if [[ "$new" -le "$old" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$new" -eq "$old" ]]; then
              echo "::warning title=Same build number::Re-running the release of build $new (assets are replaced)."
            else
              echo "::error title=Build number not higher::Build $new <= published build $old; Sparkle would not offer this update."
              exit 1
            fi
          fi

      - name: Install xcodegen
        if: steps.sdk.outputs.ok == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen

      - name: Build, verify and package
        if: steps.sdk.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error title=No update signing key::Add the SPARKLE_PRIVATE_KEY repository secret (see README → Releasing)."
            exit 1
          fi
          ./scripts/release.sh "$VERSION" --no-downloads
          echo "--- dist/ ---"
          ls -l dist
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS

      - name: Upload the workflow artifacts
        if: steps.sdk.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MenuFold-${{ steps.vars.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/appcast.xml
            dist/release-notes.md
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # The publish step uploads the dist/ files the build step produced in this same job
      # (same workspace, same disk) — no artifact re-download in between.
      - name: Publish the GitHub release
        if: steps.sdk.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zip="dist/MenuFold-${VERSION}-macos26-arm64.zip"
          dmg="dist/MenuFold-${VERSION}.dmg"
          for f in "$zip" "$dmg" dist/appcast.xml dist/SHA256SUMS; do
            [[ -f "$f" ]] || { echo "::error::missing $f"; exit 1; }
          done
          # appcast.xml is read by installed copies through releases/latest/download/appcast.xml.
          assets=("$dmg" "$zip" dist/appcast.xml dist/SHA256SUMS)

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never delete a published release: a re-run replaces the assets only.
            echo "::notice::Release $TAG exists; replacing its assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          # A tag created by hand but not pushed by this workflow is fine; otherwise create it here.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag -a "$TAG" -m "MenuFold $VERSION" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

          {
            echo "MenuFold ${VERSION} — macOS 26+, Apple silicon."
            echo
            echo "### What's new"
            cat dist/release-notes.md
            echo
            echo "### Install"
            echo "1. Download \`MenuFold-${VERSION}.dmg\`, open it and drag **MenuFold** to **Applications**."
            echo "2. Open MenuFold from Applications. It is not notarised by Apple, so macOS blocks the first launch:"
            echo "   go to **System Settings → Privacy & Security** and click **Open Anyway**. You only do this once:"
            echo "   later versions install through **Check for Updates…**."
            echo "3. Keep it in the Dock: right-click its icon → **Options → Keep in Dock**."
            echo
            echo "An older installed copy? Install this version from the DMG once; later versions update themselves."
            echo
            echo "### Verify the download"
            echo '```'
            echo 'shasum -a 256 -c SHA256SUMS'
            echo '```'
          } > notes.md

          gh release create "$TAG" "${assets[@]}" \
            --title "MenuFold ${VERSION}" \
            --notes-file notes.md \
            --verify-tag

      - name: Verify the published appcast
        if: steps.sdk.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          curl -fsSL --retry 5 --retry-delay 5 "$base/appcast.xml" -o "$work/appcast.xml"
          zip_name="MenuFold-${VERSION}-macos26-arm64.zip"
          curl -fsSL --retry 5 --retry-delay 5 "$base/$zip_name" -o "$work/$zip_name"
          python3 - "$work/appcast.xml" "$work/$zip_name" "dist/SHA256SUMS" "$zip_name" <<'PY'
          import hashlib, os, re, sys
          appcast, zpath, sums, zname = sys.argv[1:]
          t = open(appcast, encoding='utf-8').read()
          length = int(re.search(r'length="(\d+)"', t).group(1))
          sig = re.search(r'sparkle:edSignature="([^"]+)"', t)
          assert sig, 'appcast has no sparkle:edSignature'
          assert length == os.path.getsize(zpath), f'appcast length {length} != downloaded {os.path.getsize(zpath)}'
          digest = hashlib.sha256(open(zpath, 'rb').read()).hexdigest()
          expected = [l.split()[0] for l in open(sums) if l.strip().endswith(zname)]
          assert expected and expected[0] == digest, f'sha256 mismatch: {digest} vs {expected}'
          open(os.path.join(os.path.dirname(appcast), 'sig'), 'w').write(sig.group(1))
          print('appcast length, sha256 and signature presence OK')
          PY
          sign_update="$(find build-release -name sign_update -type f 2>/dev/null | head -1 || true)"
          if [[ -n "$sign_update" ]]; then
            "$sign_update" --verify "$work/$zip_name" "$(cat "$work/sig")" \
              && echo "sign_update --verify OK" \
              || { echo "::error title=Bad update signature::sign_update --verify failed for the published zip."; exit 1; }
          else
            echo "::notice::sign_update not found in the runner; checked length and sha256 only."
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          TAG: ${{ steps.vars.outputs.tag }}
          SDK: ${{ steps.sdk.outputs.version }}
          BUILT: ${{ steps.sdk.outputs.ok }}
        run: |
          {
            echo "### MenuFold release"
            echo ""
            echo "- version: \`$VERSION\`"
            echo "- tag: \`$TAG\`"
            echo "- SDK: \`$SDK\`"
            echo "- built: \`$BUILT\`"
          } >> "$GITHUB_STEP_SUMMARY"
