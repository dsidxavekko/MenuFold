<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- MenuFold app icon: a 2×2 grid of app tiles; one tile has a folded corner ("Fold").
       Rendered into App/Assets.xcassets/AppIcon.appiconset by scripts/render-icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E8DFF"/>
      <stop offset="1" stop-color="#7B3FE4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <linearGradient id="flap" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#C7CEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1B0B52" flood-opacity=".38"/>
    </filter>
    <filter id="flapShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-6" dy="10" stdDeviation="10" flood-color="#2A1A7A" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="3"/>

  <g filter="url(#shadow)" fill="url(#tile)">
    <rect x="252" y="252" width="240" height="240" rx="58"/>
    <!-- top-right tile with its corner cut along the fold line -->
    <path d="M590 252 H646 L772 378 V434 A58 58 0 0 1 714 492 H590 A58 58 0 0 1 532 434 V310 A58 58 0 0 1 590 252 Z"/>
    <rect x="252" y="532" width="240" height="240" rx="58"/>
    <rect x="532" y="532" width="240" height="240" rx="58"/>
  </g>

  <!-- the folded-over flap: the cut corner mirrored across the fold line -->
  <path d="M646 252 L772 378 H676 Q646 378 646 348 Z" fill="url(#flap)" filter="url(#flapShadow)"/>
</svg>
